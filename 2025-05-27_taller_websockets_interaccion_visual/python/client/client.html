<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Esfera Mejorada</title>
  <style>
    body { 
      margin: 0; 
      background: radial-gradient(circle, #1a1a2e 0%, #0b0b1a 100%);
      overflow: hidden;
    }
    canvas { 
      display: block; 
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #ffffff;
      font-family: 'Arial', sans-serif;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="info">Arrastra para rotar, rueda para zoom</div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/controls/OrbitControls.js';

    // Escena
    const scene = new THREE.Scene();

    // Cámara
    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 2, 5);

    // Renderizador
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Fondo estrellado
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 5000;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 2000;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.7,
      transparent: true,
      opacity: 0.8
    });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Geometría (esfera)
    const geometry = new THREE.SphereGeometry(1, 32, 32);
    const material = new THREE.MeshStandardMaterial({
      color: 0xff0000,
      metalness: 0.5,
      roughness: 0.4,
      emissive: 0x222222,
      emissiveIntensity: 0.3
    });
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 1.5, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // Controles de órbita
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.5;
    controls.minDistance = 2;
    controls.maxDistance = 10;
    controls.target.set(0, 0, 0);

    // Animación
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.y += 0.01;
      time += 0.01;
      camera.position.x = Math.sin(time * 0.1) * 0.5;
      camera.position.y = 2 + Math.cos(time * 0.1) * 0.3;
      camera.lookAt(sphere.position);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Manejo de redimensionamiento
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Conexión con WebSocket
    const ws = new WebSocket("ws://localhost:8765");

    ws.onopen = () => {
      console.log("WebSocket conectado");
    };

    ws.onmessage = (event) => {
      console.log("Mensaje recibido:", event.data);
      try {
        const { x, y, color } = JSON.parse(event.data);
        sphere.position.x = Math.max(-10, Math.min(10, x - 1));
        sphere.position.y = Math.max(-10, Math.min(10, y));
        const colorMap = {
          red: 0xff0000,
          green: 0x00ff00,
          blue: 0x0000ff
        };
        sphere.material.color.setHex(colorMap[color] || 0xffffff);
      } catch (e) {
        console.error("Error al parsear mensaje WebSocket:", e);
      }
    };

    ws.onerror = (error) => {
      console.error("Error en WebSocket:", error);
    };

    ws.onclose = () => {
      console.log("WebSocket cerrado");
    };

    // Debugging: Verificar que la esfera esté en la escena
    console.log("Esfera añadida:", scene.getObjectByProperty('uuid', sphere.uuid));
  </script>
</body>
</html>
